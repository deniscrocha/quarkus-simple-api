quarkus:
    datasource:
        db-kind: mysql
        username: quarkus
        password: quarkus
        jdbc: { url: jdbc:mysql://localhost:3306/quarkus }
    liquibase:
        migrate-at-start: true
        change-log: /liquibase/liquibase-changelog.yml
    log:
        category:
            "liquibase":
                level: INFO
    native:
        resources:
            includes: publicKey.pem
jwt:
    issuer: QUARKUS-SIMPLE-API
    token-duration-hours: 1

mp:
    jwt:
        verify:
            # TODO: Move issues to ENV var
            issuer: ${jwt.issuer:QUARKUS-SIMPLE-API}
            publickey:
                location: publicKey.pem
smallrye:
    jwt:
        sign:
            key:
                location: rsaPrivateKey.pem
